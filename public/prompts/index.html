<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompts - Cyfernode 5.0</title>
<meta name="description" content="Event prompts for Cyfernode 5.0 - all 10 competition briefs in one place.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="/0e1a62f8-fec9-4cae-bc86-2298aa63e516.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,600,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --text: #111114;
  --muted: rgba(17, 17, 20, 0.56);
  --orange: #d24500;
  --font-sans: 'Satoshi', system-ui, sans-serif;
  --font-px: 'Satoshi', system-ui, sans-serif;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background: #fff;
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

html {
  scrollbar-gutter: stable;
}

#exit-btn {
  position: fixed;
  top: 28px;
  left: 28px;
  z-index: 800;
  font-family: var(--font-px);
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: color 0.2s;
}

#exit-btn:hover {
  color: var(--orange);
}

#exit-btn i {
  font-size: 15px;
}

.page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 80px 24px 56px;
}

.panel {
  width: min(100%, 428px);
  display: flex;
  flex-direction: column;
}

.head {
  text-align: center;
  margin-bottom: 28px;
  width: 100%;
}

.s0-brand {
  display: block;
  width: min(100%, 280px);
  height: auto;
  margin: 0 auto 14px;
}

.s0-wordmark {
  display: block;
  width: min(100%, 428px);
  height: auto;
  margin: 0 auto;
}

/* Countdown Timer */
.countdown-section {
  margin-bottom: 32px;
  text-align: center;
  padding: 18px 20px;
  background: #fafafa;
  border: 1px solid rgba(17, 17, 20, 0.08);
}

.countdown-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

.timer-grid {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
}

.timer-unit {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.timer-val {
  font-size: clamp(1.6rem, 4vw, 2.2rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--text);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.timer-unit-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 4px;
}

.timer-colon {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--orange);
  margin-bottom: 14px;
}

.unlocked-badge {
  display: none;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #0a7a0a;
}

/* File List */
.file-list {
  list-style: none;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.file-list li {
  width: 100%;
}

.file-link {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 2px 0;
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.01em;
  text-decoration: none;
  transition: opacity 0.2s ease, color 0.15s ease, text-decoration-color 0.15s ease;
}

.file-link:hover {
  color: var(--orange);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.file-link.disabled {
  opacity: 0.35;
  cursor: not-allowed;
  pointer-events: none;
  user-select: none;
}

.file-link.disabled:hover {
  color: var(--text);
  text-decoration: none;
}

.file-link:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 3px;
  border-radius: 2px;
}

.file-icon {
  width: 20px;
  height: 24px;
  flex-shrink: 0;
  color: var(--text);
  transition: color 0.15s ease;
}

.file-link:hover .file-icon {
  color: var(--orange);
}

.lock-icon-tag {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
}

@media (max-width: 768px) {
  #exit-btn {
    position: absolute;
    top: 24px;
    left: 24px;
  }

  .page {
    padding: 100px 16px 40px;
  }
}
</style>
</head>
<body>
<a href="/" id="exit-btn"><i class="fa-solid fa-arrow-left"></i> Exit</a>

<main class="page">
  <div class="panel">
    <header class="head">
      <img class="s0-brand" src="/assets/CYFERNODE-5.0.svg" alt="Cyfernode 5.0" width="586" height="58">
      <img class="s0-wordmark" src="/assets/PROMPTS.svg" alt="Prompts" width="428" height="172">
    </header>

    <div class="countdown-section" id="countdown-section">
      <div class="countdown-label" id="countdown-label">Prompts Unlock In</div>
      <div class="timer-grid" id="timer-grid">
        <div class="timer-unit">
          <span class="timer-val" id="timer-days">00</span>
          <span class="timer-unit-label">Days</span>
        </div>
        <span class="timer-colon">:</span>
        <div class="timer-unit">
          <span class="timer-val" id="timer-hours">00</span>
          <span class="timer-unit-label">Hours</span>
        </div>
        <span class="timer-colon">:</span>
        <div class="timer-unit">
          <span class="timer-val" id="timer-mins">00</span>
          <span class="timer-unit-label">Mins</span>
        </div>
        <span class="timer-colon">:</span>
        <div class="timer-unit">
          <span class="timer-val" id="timer-secs">00</span>
          <span class="timer-unit-label">Secs</span>
        </div>
      </div>
      <div class="unlocked-badge" id="unlocked-badge">
        <i class="fa-solid fa-lock-open" style="margin-right: 6px;"></i> Prompts are now accessible
      </div>
    </div>

    <ul class="file-list" id="file-list"></ul>
  </div>
</main>

<script src="/prompts/events.js"></script>
<script>
const FILE_ICON = `
  <svg class="file-icon" viewBox="0 0 22 28" fill="none" aria-hidden="true">
    <path d="M13 1H4.5C3.12 1 2 2.12 2 3.5v21C2 25.88 3.12 27 4.5 27h13c1.38 0 2.5-1.12 2.5-2.5V9L13 1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M13 1v8h8" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>
`;

function promptHref(event) {
  return `/prompts/${event.id}-prompt`;
}

// 25th September 2026 - 00:00 AM IST
const PROMPT_UNLOCK_TIME = new Date('2026-09-25T00:00:00+05:30').getTime();

const timerDays = document.getElementById('timer-days');
const timerHours = document.getElementById('timer-hours');
const timerMins = document.getElementById('timer-mins');
const timerSecs = document.getElementById('timer-secs');
const timerGrid = document.getElementById('timer-grid');
const countdownLabel = document.getElementById('countdown-label');
const unlockedBadge = document.getElementById('unlocked-badge');

function renderFileList(isLocked) {
  document.getElementById('file-list').innerHTML = window.CYFERNODE_EVENTS.map((event) => `
    <li>
      <a class="file-link ${isLocked ? 'disabled' : ''}" href="${isLocked ? 'javascript:void(0)' : promptHref(event)}" title="${isLocked ? 'Locked until 25 Sep 2026, 00:00 AM' : event.category}">
        ${FILE_ICON}
        <span>${event.name}</span>
        ${isLocked ? '<i class="fa-solid fa-lock lock-icon-tag"></i>' : ''}
      </a>
    </li>
  `).join('');
}

let isCurrentlyLocked = true;
renderFileList(true);

function updateCountdown() {
  const now = Date.now();
  const diff = PROMPT_UNLOCK_TIME - now;

  if (diff <= 0) {
    if (isCurrentlyLocked) {
      isCurrentlyLocked = false;
      renderFileList(false);
      timerGrid.style.display = 'none';
      countdownLabel.style.display = 'none';
      unlockedBadge.style.display = 'block';
    }
    return;
  }

  isCurrentlyLocked = true;

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const mins = Math.floor((diff / (1000 * 60)) % 60);
  const secs = Math.floor((diff / 1000) % 60);

  timerDays.textContent = String(days).padStart(2, '0');
  timerHours.textContent = String(hours).padStart(2, '0');
  timerMins.textContent = String(mins).padStart(2, '0');
  timerSecs.textContent = String(secs).padStart(2, '0');
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>
</body>
</html>
