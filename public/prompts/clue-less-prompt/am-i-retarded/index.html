<script>
(function() {
  function hasValidAuth() {
    try {
      var raw = sessionStorage.getItem('cyfernode-clueless-auth') || localStorage.getItem('cyfernode-clueless-auth');
      if (raw) {
        var sess = JSON.parse(raw);
        if (sess && (sess.token || sess.profile) && (sess.profile && sess.profile.schoolCode)) {
          return true;
        }
      }
    } catch(e) {}
    return false;
  }

  if (!hasValidAuth()) {
    try {
      sessionStorage.setItem('cyfernode_clueless_auth_required', '1');
    } catch(e) {}
    window.location.replace('/prompts/clue-less-prompt?auth=required');
  }
})();
</script>
<!-- CLUELESS_AUTH:END -->

<style>

<script>
(function(){
  try {
    var raw = localStorage.getItem('cyfernode-clueless-auth') || sessionStorage.getItem('cyfernode-clueless-auth');

<div id="preloader"><div class="preloader-spinner"></div>
<script>
  (function() {
    function hideLoader() {
      var p = document.getElementById('preloader');
      if (p) {
        p.style.opacity = '0';
        p.style.visibility = 'hidden';
        setTimeout(function() { if (p && p.parentNode) p.parentNode.removeChild(p); }, 350);
      }
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(hideLoader, 200);
    } else {
      window.addEventListener('DOMContentLoaded', hideLoader);
      window.addEventListener('load', hideLoader);
    }
    setTimeout(hideLoader, 1200);
  })();
</script></div>
