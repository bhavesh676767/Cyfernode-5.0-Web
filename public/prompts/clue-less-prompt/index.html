<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>Clue-Less | Cyfernode 5.0</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      color: #20221f;
      background: #f7f7f5;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse at 50% 0%, #fff 0%, #f7f7f5 68%);
    }

    main {
      width: min(100%, 480px);
      text-align: center;
    }

    #countdown-view p {
      margin: 0 0 14px;
      color: #757971;
      font-size: 15px;
    }

    #countdown {
      color: #20221f;
      font-size: clamp(2.5rem, 12vw, 4rem);
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      line-height: 1;
    }

    #school-codes {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
      animation: reveal 450ms ease both;
    }

    #school-codes li {
      font-size: clamp(1.75rem, 8vw, 2.5rem);
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    #positions-date {
      margin: 28px 0 0;
      color: #656a62;
      font-size: 16px;
    }

    [hidden] { display: none !important; }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section id="reveal-view" aria-live="polite">
      <ul id="school-codes">
        <li>CYN09</li>
        <li>CYN33</li>
        <li>CYN36</li>
      </ul>
      <p id="positions-date">Positions on 9th Oct 2026.</p>
    </section>
  </main>
</body>
</html>
