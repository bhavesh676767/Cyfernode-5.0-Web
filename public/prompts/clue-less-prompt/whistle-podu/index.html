<html lang="en">

<style>
:root {
  --text: #111114;
  --muted: rgba(17, 17, 20, 0.44);
  --orange: #d24500;
  --font-sans: 'Satoshi', system-ui, sans-serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background: #fff;
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* Preloader */
#preloader {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.preloader-spinner {
  width: 32px;
  height: 32px;
  border: 2px solid rgba(17, 17, 20, 0.1);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

#exit-btn {
  position: fixed;
  top: 28px;
  left: 28px;
  z-index: 800;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color 0.15s ease;
}

#exit-btn:hover {
  color: var(--orange);
}

.page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 100px 24px 60px;
}

.panel {
  width: min(100%, 580px);
}

.clue-stack {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.clue-heading {
  font-size: clamp(2rem, 4.5vw, 2.75rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.05;
  color: var(--text);
}

.clue-quote {
  font-size: 18px;
  font-style: italic;
  color: rgba(17, 17, 20, 0.88);
  line-height: 1.6;
  border-left: 2px solid var(--text);
  padding-left: 14px;
}

.clue-line {
  font-size: 15px;
  line-height: 1.6;
  color: rgba(17, 17, 20, 0.75);
}

/* Minimal Input */
.input-line {
  display: flex;
  align-items: center;
  border-bottom: 2px solid var(--text);
  padding: 6px 0;
  margin-top: 16px;
}

.input-prompt {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-right: 12px;
  user-select: none;
}

.raw-input {
  flex: 1;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  outline: none;
}

.status-echo {
  font-size: 13px;
  font-family: var(--font-mono);
  font-weight: 600;
  min-height: 20px;
  margin-top: 8px;
  transition: opacity 0.2s ease;
  line-height: 1.4;
}

.status-echo.success {
  color: #10b981;
}

.status-echo.error {
  color: #b91c1c;
}

.top-reset-btn {
  position: fixed;
  top: 28px;
  right: 28px;
  z-index: 800;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.15s ease;
}

.top-reset-btn:hover {
  color: var(--text);
}

@media (max-width: 768px) {
  #exit-btn {
    top: 24px;
    left: 20px;
  }
  .top-reset-btn {
    top: 24px;
    right: 20px;
  }
  .page {
    padding: 96px 16px 40px;
  }
}

<body>
<!-- LOCK:START -->
<div id="lock-overlay" style="position:fixed;inset:0;background:#08080b;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;">
  <div style="font-family:'Consolas',monospace;font-size:10px;letter-spacing:0.18em;color:rgba(255,255,255,0.25);text-transform:uppercase;">Cyfernode 5.0 · Clue-Less</div>
  <div style="font-family:'Satoshi',system-ui,sans-serif;font-size:clamp(2rem,6vw,3rem);font-weight:900;color:#fff;letter-spacing:-0.04em;line-height:1;">LOCKED</div>
  <div style="font-family:'Consolas',monospace;font-size:12px;color:rgba(255,255,255,0.35);text-align:center;margin-top:4px;">Opens at 12:00 PM &nbsp;·&nbsp; 27 Sep 2026</div>
  <div id="lock-countdown" style="font-family:'Consolas',monospace;font-size:clamp(1.4rem,4vw,2rem);font-weight:700;color:#d24500;letter-spacing:0.08em;margin-top:12px;">--:--:--</div>
  <div style="font-family:'Consolas',monospace;font-size:10px;color:rgba(255,255,255,0.15);margin-top:24px;letter-spacing:0.08em;">HH &nbsp; MM &nbsp; SS</div>
</div>
<script>
(function(){
  var UNLOCK = new Date('2026-09-27T12:00:00+05:30').getTime();
  var overlay = document.getElementById('lock-overlay');
  var cd = document.getElementById('lock-countdown');
  if (!overlay) return;
  function tick() {
    var now = Date.now();
    var diff = UNLOCK - now;
    if (diff <= 0) { overlay.remove(); return; }
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    cd.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  tick();
  var iv = setInterval(function(){ tick(); if (Date.now() >= UNLOCK) clearInterval(iv); }, 1000);
})();
</script>
<!-- LOCK:END -->

<div id="preloader">
  <div class="preloader-spinner"></div>
</div>

<a href="/prompts/clue-less-prompt" id="exit-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
<button type="button" id="reset-btn" class="top-reset-btn" title="Reset level progress">Reset</button>

<main class="page">
  <article class="panel" id="viewport">
    <div class="clue-stack">
      <h1 class="clue-heading">WHISTLE PODU</h1>
      
      <!-- [COMM LINK]: The dugout radio awaits the command. Call the team's battle cry as a function in the developer console. -->
      <!-- frequency: whistlePodu() -->
      <div class="clue-quote">
        “5 stars, 1 whistle”
      </div>

      <div class="clue-line" style="font-size: 13px; color: var(--muted); font-style: italic;">
        The whistle cannot be blown from the stands. Speak to the dugout terminal.
      </div>

      <form id="verify-form">
        <div class="input-line">
          <span class="input-prompt">&gt;</span>
          <input
            type="text"
            class="raw-input"
            id="user-input"
            placeholder="final answer..."

            autofocus
          />

        <div class="status-echo" id="echo"></div>

<script type="module">
// Preloader dismissal
window.addEventListener('DOMContentLoaded', () => {
  const preloader = document.getElementById('preloader');
  if (preloader) {
    preloader.style.opacity = '0';
    preloader.style.visibility = 'hidden';
    setTimeout(() => preloader.remove(), 300);
  }
});

// Helper clean string
async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function clean(str) {
  return String(str || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
}

// Global Console Easter Egg: whistlePodu() and aliases
function base64UrlEncode(str) {
  return btoa(str)
    .replace(/\+/g, '-')
    .replace(/\//g, '_')
    .replace(/=+$/, '');
}

const jwtHeader = base64UrlEncode(JSON.stringify({ alg: "HS256", typ: "JWT" }));
const jwtPayload = base64UrlEncode(JSON.stringify({ key: "2010-2023", next: "/vault" }));
const jwtSig = base64UrlEncode("whistle_podu_csk_signature_2024");
const jwtToken = `${jwtHeader}.${jwtPayload}.${jwtSig}`;

function dispatchDugout() {
  console.log("%c⚡ [DUGOUT TRANSMISSION DECODED]", "color: #f59e0b; font-weight: bold; font-family: monospace; font-size: 14px;");
  console.log("%cPayload contains the key & the next coordinate. Base64url-decode the 2nd segment.", "color: #94a3b8; font-family: monospace; font-size: 12px;");
  return jwtToken;
}

window.whistlePodu = dispatchDugout;
window.whistle = dispatchDugout;
window.whistle_podu = dispatchDugout;
window.dugout = dispatchDugout;
window.csk = dispatchDugout;
window.thala = dispatchDugout;

console.log(
  "%c⚡ [CHEPPAUK DUGOUT FREQUENCY OPEN]\n%cAn encrypted transmission has been wired into this terminal.\nInvoke the whistle function in console: %cwhistlePodu()%c (or %cwhistle()%c)",
  "color: #f59e0b; font-size: 13px; font-weight: bold; font-family: monospace;",
  "color: #94a3b8; font-family: monospace; font-size: 11px;",
  "color: #38bdf8; font-weight: bold; font-family: monospace;",
  "color: #94a3b8; font-family: monospace; font-size: 11px;",
  "color: #38bdf8; font-weight: bold; font-family: monospace;",
  "color: #94a3b8; font-family: monospace; font-size: 11px;"
);

// Verification Form
const form = document.getElementById('verify-form');
const input = document.getElementById('user-input');
const echo = document.getElementById('echo');

function markLevelCompleted(levelId) {
  try {
    const raw = localStorage.getItem('cyfernode_clueless_completed_levels');
    const list = raw ? JSON.parse(raw) : [];
    if (!list.includes(levelId)) {
      list.push(levelId);
      localStorage.setItem('cyfernode_clueless_completed_levels', JSON.stringify(list));
    }
  } catch {}
}

form?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const val = clean(input.value);
  if (!val) return;

  const TARGET_HASH = 'ed269be483b1a64be9df89a97af66c6c676dc352bd26edc68fe652cc9d9b3628';
  const hashed = await sha256(val);
  if (hashed === TARGET_HASH) {
    echo.textContent = 'Correct.';
    echo.className = 'status-echo success';
    input.disabled = true;
    markLevelCompleted('whistle-podu');
    setTimeout(() => {
      document.body.style.transition = 'opacity 0.8s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = '/prompts/clue-less-prompt';
      }, 800);
    }, 3000);
  } else {
    echo.textContent = 'not quite';
    echo.className = 'status-echo error';
    input.select();
  }
});

document.getElementById('reset-btn')?.addEventListener('click', () => {
  if (confirm('Reset input?')) {
    input.value = '';
    echo.textContent = '';
    input.focus();
  }
});
</script>
</body>
