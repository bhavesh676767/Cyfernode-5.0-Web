<style>
:root {
  --text: #111114;
  --muted: rgba(17, 17, 20, 0.44);
  --orange: #d24500;
  --font-sans: 'Satoshi', system-ui, sans-serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background: #fff;
  color: var(--text);
  font-family: var(--font-sans);

}

#exit-btn {
  position: fixed;
  top: 28px;
  left: 28px;
  z-index: 800;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color 0.15s ease;
}

#exit-btn:hover {
  color: var(--orange);
}

.page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 100px 24px 60px;
}

.panel {
  width: min(100%, 580px);
}

.clue-stack {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.clue-heading {
  font-size: clamp(2rem, 4.5vw, 2.75rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.05;
  color: var(--text);
}

.clue-subheading {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}

.clue-quote {
  font-size: 16px;
  font-style: italic;
  color: rgba(17, 17, 20, 0.82);
  line-height: 1.6;
  border-left: 2px solid var(--text);
  padding-left: 14px;
}

.clue-line {
  font-size: 15px;
  line-height: 1.6;
  color: rgba(17, 17, 20, 0.75);
}

/* Cipher display */
.cipher-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 24px 16px;
  background: #111114;
  border-radius: 8px;
  margin: 6px 0;
}

.cipher-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: center;
}

.cipher-word {
  display: flex;
  gap: 4px;
}

.cipher-rune {
  width: 24px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: #ff9858;
  border: 1px dashed rgba(255, 255, 255, 0.2);
  border-radius: 3px;
  user-select: none;
}

.cipher-tag {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.4);
}

/* Minimal Input */
.input-line {
  display: flex;
  align-items: center;
  border-bottom: 2px solid var(--text);
  padding: 6px 0;
  margin-top: 16px;
}

.input-prompt {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin-right: 12px;
  user-select: none;
}

.raw-input {
  flex: 1;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  outline: none;
}

.status-echo {
  font-size: 13px;
  font-family: var(--font-mono);
  font-weight: 600;
  min-height: 20px;
  margin-top: 8px;
  transition: opacity 0.2s ease;
}

.status-echo.success {
  color: #10b981;
}

.status-echo.error {
  color: #b91c1c;
}

/* Completion */
.done-stack {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.done-tag {
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--muted);
}

.done-title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.done-link {
  font-size: 14px;
  font-weight: 700;
  color: var(--orange);
  text-decoration: underline;
  text-underline-offset: 4px;
}

.top-reset-btn {
  position: fixed;
  top: 28px;
  right: 28px;
  z-index: 800;
  background: transparent;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  padding: 4px 8px;
  transition: color 0.15s ease;
}

.top-reset-btn:hover {
  color: var(--text);
}

@media (max-width: 768px) {
  #exit-btn {
    top: 24px;
    left: 20px;
  }
  .top-reset-btn {
    top: 24px;
    right: 20px;
  }
  .page {
    padding: 96px 16px 40px;
  }

<script>
(function(){
  var UNLOCK = new Date('2026-09-27T12:00:00+05:30').getTime();
  var overlay = document.getElementById('lock-overlay');
  var cd = document.getElementById('lock-countdown');
  if (!overlay) return;
  function tick() {
    var now = Date.now();
    var diff = UNLOCK - now;
    if (diff <= 0) { overlay.remove(); return; }
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    cd.textContent = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }
  tick();
  var iv = setInterval(function(){ tick(); if (Date.now() >= UNLOCK) clearInterval(iv); }, 1000);
})();
</script>

<script type="module">
const STORAGE_KEY = 'cyfernode_clueless_accuracy_stage'

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function clean(str) {
  return String(str || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '')
}

const RUNES = {
  'A': 'ᚪ', 'B': 'ᛒ', 'C': 'ᚲ', 'D': 'ᛞ', 'E': 'ᛖ',
  'F': 'ᚠ', 'G': 'ᚷ', 'H': 'ᚺ', 'I': 'ᛁ', 'J': 'ᛃ',
  'K': 'ᚲ', 'L': 'ᛚ', 'M': 'ᛗ', 'N': 'ᚾ', 'O': 'ᛟ',
  'P': 'ᛈ', 'Q': 'ᛩ', 'R': 'ᚱ', 'S': 'ᛊ', 'T': 'ᛏ',
  'U': 'ᚢ', 'V': 'ᚡ', 'W': 'ṹ', 'X': 'ᛪ', 'Y': 'ᛦ',
  'Z': 'ᛎ', '0': '⓪', '1': '①', '2': '②', '3': '③',
  '4': '④', '5': '⑤', '6': '⑥', '7': '⑦', '8': '⑧', '9': '⑨'
}

function renderRunes(words) {
  const wordsHtml = words.map(word => {
    const glyphs = word.split('').map(char => `<span class="cipher-rune">${RUNES[char] || char}</span>`).join('')
    return `<div class="cipher-word">${glyphs}</div>`
  }).join('<span style="color:rgba(255,255,255,0.25);font-size:14px;">•</span>')

  return `
    <div class="cipher-box">
      <div class="cipher-row">${wordsHtml}</div>
      <div class="cipher-tag">[GENSHIN SYMBOL CIPHER]</div>
    </div>
  `
}

const STAGES = [

  {

  // Stage 1.5
  {

    ],
    validHashes: [
      '17057013652043f033655cb83d71ffc0d2423034c4f47d5bbb32bb61b3be4448',
      '4fc82b26aecb47d2868c4efbe3581732a3e7cbcc6c2efb32062c08170a05eeb8',
      'e979074ebd5633a7263aa48c4b7dea055a769115fbc0a7de459f8a74cd2efd2b'
    ],
    next: 2,

  // Stage 2
  {
    id: 2,
    title: 'XI <!-- 11 -->',
    quotes: [

    validHashes: [

]

let currentStage = parseFloat(localStorage.getItem(STORAGE_KEY)) || 1

function setStage(val) {
  currentStage = val
  localStorage.setItem(STORAGE_KEY, String(val))
}

function render() {
  const container = document.getElementById('viewport')
  if (!container) return

  if (currentStage === 'CLEAR') {
    container.innerHTML = `
      <div class="done-stack">
        <span class="done-tag">[RECORDED]</span>
        <h1 class="done-title">SOREN IVERSON</h1>
        <p class="clue-line">Accuracy restored.</p>
        <a href="/prompts/clue-less-prompt" class="done-link">&larr; Return</a>
      </div>
    `
    return
  }

  const stage = STAGES.find(s => s.id === currentStage) || STAGES[0]

  const quotesHtml = (stage.quotes || []).map(q => 
    `<div class="clue-quote">${q.replace(/\n/g, '<br>')}</div>`
  ).join('')

  const subquotesHtml = (stage.subquotes || []).map(q => 
    `<div class="clue-quote">${q.replace(/\n/g, '<br>')}</div>`
  ).join('')

  const linesHtml = (stage.lines || []).map(l => 
    `<div class="clue-line" style="font-weight: 700; font-size: 16px;">${l}</div>`
  ).join('')

  container.innerHTML = `
    <div class="clue-stack">
      <h1 class="clue-heading">${stage.title}</h1>
      ${quotesHtml}
      ${stage.subheading ? `<div class="clue-subheading">${stage.subheading}</div>` : ''}
      ${subquotesHtml}
      ${linesHtml}
      ${stage.isCipher ? renderRunes(stage.cipherWords) : ''}

      <form id="clue-form">
        <div class="input-line">
          <span class="input-prompt">&gt;</span>
          <input 
            type="text" 
            class="raw-input" 
            id="user-input" 
            autocomplete="off" 
            spellcheck="false" 
            autofocus 
          />
        </div>
        <div class="status-echo" id="echo"></div>
      </form>
    </div>
  `

  const form = document.getElementById('clue-form')
  const input = document.getElementById('user-input')
  const echo = document.getElementById('echo')

  input?.focus()

  form?.addEventListener('submit', async (e) => {
    e.preventDefault()
    const val = clean(input.value)
    if (!val) return

    const hashed = await sha256(val);
    const ok = stage.validHashes && stage.validHashes.includes(hashed);

function markLevelCompleted(levelId) {
  try {
    const raw = localStorage.getItem('cyfernode_clueless_completed_levels')
    const list = raw ? JSON.parse(raw) : []
    if (!list.includes(levelId)) {
      list.push(levelId)
      localStorage.setItem('cyfernode_clueless_completed_levels', JSON.stringify(list))
    }
  } catch {}
}

    if (ok) {
      echo.textContent = 'Correct.'
      echo.className = 'status-echo success'
      input.disabled = true
      if (stage.next === 'CLEAR') {
        markLevelCompleted('a-comedy-of-accuracy')
        setStage('CLEAR')
        setTimeout(() => {
          document.body.style.transition = 'opacity 0.8s ease'
          document.body.style.opacity = '0'
          setTimeout(() => {
            window.location.href = '/prompts/clue-less-prompt'
          }, 800)
        }, 3000)
      } else {
        setTimeout(() => {
          setStage(stage.next)
          render()
        }, 3000)
      }
    } else {
      echo.textContent = '...'
      echo.className = 'status-echo error'
      input.select()
    }
  })
}

document.getElementById('reset-btn')?.addEventListener('click', () => {
  if (confirm('Reset level progress?')) {
    setStage(1)
    render()
  }
})

render()
</script>
