<!DOCTYPE html>

<!-- CLUELESS_AUTH:START -->
<script>
(function() {
  function hasValidAuth() {
    try {
      var raw = sessionStorage.getItem('cyfernode-clueless-auth') || localStorage.getItem('cyfernode-clueless-auth');
      if (raw) {
        var sess = JSON.parse(raw);
        if (sess && (sess.token || sess.profile) && (sess.profile && sess.profile.schoolCode)) {
          return true;
        }
      }
    } catch(e) {}
    return false;
  }

  if (!hasValidAuth()) {
    try {
      sessionStorage.setItem('cyfernode_clueless_auth_required', '1');
    } catch(e) {}
    window.location.replace('/prompts/clue-less-prompt?auth=required');
  }
})();
</script>
<!-- CLUELESS_AUTH:END -->

<style>

<script>
(function(){
  try {
    var raw = localStorage.getItem('cyfernode-clueless-auth') || sessionStorage.getItem('cyfernode-clueless-auth');
    var sess = raw ? JSON.parse(raw) : null;
    var authed = Boolean(sess && sess.token && sess.profile && sess.profile.schoolCode);

<script type="module">
window.addEventListener('DOMContentLoaded', () => {
  const preloader = document.getElementById('preloader');
  if (preloader) {
    preloader.style.opacity = '0';
    preloader.style.visibility = 'hidden';
    setTimeout(() => preloader.remove(), 300);
  }
});

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function clean(str) {
  return String(str || '')
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9]/g, '');
}

const form = document.getElementById('checker-form');
const input = document.getElementById('verify-input');
const echo = document.getElementById('echo');

function markLevelCompleted(levelId) {
  try {
    const raw = localStorage.getItem('cyfernode_clueless_completed_levels');
    const list = raw ? JSON.parse(raw) : [];
    if (!list.includes(levelId)) {
      list.push(levelId);
      localStorage.setItem('cyfernode_clueless_completed_levels', JSON.stringify(list));
    }
    const rawAuth = localStorage.getItem('cyfernode-clueless-auth') || sessionStorage.getItem('cyfernode-clueless-auth');
    const auth = rawAuth ? JSON.parse(rawAuth) : null;
    if (auth && auth.profile && auth.profile.schoolCode) {
      const code = auth.profile.schoolCode;
      const score = list.length * 100;
      fetch('https://stjjvgnewkswzwmmzyoh.supabase.co/rest/v1/rpc/update_clueless_score', {
        method: 'POST',
        headers: {
          apikey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0amp2Z25ld2tzd3p3bW16eW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTM2NDgsImV4cCI6MjEwMzMyOTY0OH0.l_vf_ovBAbMP_iIn_easi8ztLkC13SJr-JxuWtdM9ng',
          authorization: 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0amp2Z25ld2tzd3p3bW16eW9oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NTM2NDgsImV4cCI6MjEwMzMyOTY0OH0.l_vf_ovBAbMP_iIn_easi8ztLkC13SJr-JxuWtdM9ng',
          'content-type': 'application/json'
        },
        body: JSON.stringify({ p_school_code: code, p_score: score, p_current_level: levelId })
      }).catch(function(){});
    }
  } catch(e) {}
}

form?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const val = clean(input.value);
  if (!val) return;

  const TARGET_HASH = 'ed269be483b1a64be9df89a97af66c6c676dc352bd26edc68fe652cc9d9b3628';
  const hashed = await sha256(val);
  if (hashed === TARGET_HASH) {
    echo.textContent = 'Correct.';
    echo.className = 'status-echo success';
    input.disabled = true;
    markLevelCompleted('whistle-podu');
    setTimeout(() => {
      document.body.style.transition = 'opacity 0.8s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = '/prompts/clue-less-prompt';
      }, 800);
    }, 3000);
  } else {
    echo.textContent = 'not quite';
    echo.className = 'status-echo error';
    input.select();
  }
});
</script>
</body>
